name: Peças Automotivas Coletor — Editais (fase 1)

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC (~02h BRT) — rebusca os editais recebendo proposta, por termo
  workflow_dispatch:

jobs:
  coleta_editais:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r analise/requirements.txt

      - name: Rodar coletor de editais de peças automotivas (fase 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: analise
        run: python coletor_pecas.py
